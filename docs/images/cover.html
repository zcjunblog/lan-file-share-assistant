<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1600, initial-scale=1">
<title>局域网文件分享助手 · 品牌封面</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1600px;height:720px;overflow:hidden}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#183450;background:#fff;-webkit-font-smoothing:antialiased}.cover{position:relative;width:1600px;height:720px;background:linear-gradient(115deg,#fff 0%,#fff 48%,#f7faff 100%);overflow:hidden}.topline{position:absolute;left:96px;top:88px;display:flex;align-items:center;gap:22px}.logo{height:72px;width:72px;border-radius:16px}.eyebrow{font-family:Arial,sans-serif;font-size:17px;letter-spacing:3px;font-weight:700;color:#2866b8}.family{font-size:15px;letter-spacing:2px;color:#63778b;margin-top:10px}.copy{position:absolute;left:96px;top:256px;width:775px}h1{font-size:64px;line-height:1.4;font-weight:650;letter-spacing:0;margin:0;color:#143451}h2{font-size:29px;font-weight:500;line-height:1.5;letter-spacing:1px;margin:30px 0 0;color:#2866b8}.description{font-size:22px;font-weight:400;line-height:1.65;margin:24px 0 0;color:#63778b}.principle{position:absolute;left:96px;bottom:89px;display:flex;align-items:center;gap:14px;font-size:18px;color:#586d83;letter-spacing:1px}.principle::before{content:"";display:block;height:3px;width:34px;background:#2866b8}.scene{position:absolute;left:900px;top:66px;width:604px;height:588px;border-radius:44px;background:#edf4fd;overflow:hidden}.scene::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;left:180px;top:141px;border:1px solid #d8e6f7}.scene::after{content:"";position:absolute;width:510px;height:510px;border-radius:50%;left:135px;top:96px;border:1px solid #dfeaf8}.caption{position:absolute;left:32px;top:28px;color:#536b86;font-size:14px;letter-spacing:2px;z-index:3}.phone{position:absolute;z-index:2;left:282px;top:60px;width:264px;height:478px;border-radius:37px;border:7px solid #24486b;background:white;box-shadow:0 18px 32px #234a7620}.notch{position:absolute;top:8px;left:87px;width:76px;height:16px;border-radius:20px;background:#24486b}.phone-inner{padding:50px 18px 16px}.phone-heading{font-size:22px;font-weight:600;color:#183450;margin-bottom:8px}.phone-sub{font-size:12px;line-height:1.6;color:#63778b}.rule{height:1px;background:#e5edf6;margin:20px 0 17px}.files-label{font-size:13px;font-weight:500;color:#59738f;margin-bottom:12px}.phone-file{padding:15px 9px;display:flex;align-items:center;gap:10px;border:1px solid #e0e9f3;border-radius:10px;margin:9px 0}.tiny-doc{width:25px;height:31px;border-radius:4px;background:#eaf2fd;position:relative;flex-shrink:0}.tiny-doc::before,.tiny-doc::after{content:"";position:absolute;left:7px;height:2px;background:#5d88bd;border-radius:2px}.tiny-doc::before{top:11px;width:12px}.tiny-doc::after{top:17px;width:8px}.file-name{font-size:13px;line-height:1.5;color:#2b4867}.file-meta{font-family:Arial,sans-serif;font-size:10px;color:#63778b;margin-top:4px}.download{height:38px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#2866b8;color:white;font-size:13px;font-weight:500;margin-top:23px}.expiry{font-size:11px;text-align:center;color:#63778b;margin-top:13px}.document{position:absolute;z-index:3;left:45px;top:176px;width:186px;height:248px;background:#fff;border:1px solid #d9e5f4;border-radius:19px;box-shadow:0 18px 32px #234a7614;transform:rotate(-5deg)}.doc-head{position:absolute;left:26px;top:29px;width:44px;height:52px;border-radius:8px;background:#e9f1fc;display:flex;align-items:center;justify-content:center}.doc-title{position:absolute;left:26px;top:104px;color:#294c72;font-size:20px;font-weight:550}.doc-line{position:absolute;left:26px;height:6px;background:#e0eafa;border-radius:4px}.l1{top:148px;width:122px}.l2{top:166px;width:99px}.l3{top:184px;width:112px}.doc-footer{position:absolute;left:26px;bottom:19px;font-size:11px;letter-spacing:1px;color:#63778b}.handoff{position:absolute;z-index:5;left:203px;top:268px;width:90px;height:90px;border-radius:50%;background:#2866b8;display:flex;align-items:center;justify-content:center;border:7px solid #edf4fd}.scene-tag{position:absolute;z-index:4;left:50px;bottom:59px;font-size:14px;letter-spacing:2px;color:#45678c}.corner{position:absolute;z-index:2;left:30px;top:151px;width:214px;height:291px;fill:none;stroke:#b5cdef;stroke-width:2;stroke-linecap:round}.dot{width:5px;height:5px;background:#a9c4e6;border-radius:50%;position:absolute;left:251px;top:133px}
</style>
</head>
<body>
<main class="cover" aria-label="局域网文件分享助手品牌封面">
  <div class="topline" data-qa-text><img class="logo" src="../../skills/lan-file-share-assistant/assets/icon-512.png" alt="文件交接图标"><div><div class="eyebrow">LAN FILE SHARE ASSISTANT</div><div class="family">本地文件的临时交付工具</div></div></div>
  <section class="copy"><h1 data-qa-text>局域网文件分享助手</h1><h2 data-qa-text>指定文件 · 扫码下载 · 自动过期</h2><p class="description" data-qa-text>把选定的本地文件，临时交给另一台设备。</p></section>
  <div class="principle" data-qa-text>先检测环境，再开始分享</div>
  <section class="scene" aria-label="文件发送至手机的界面示意图">
    <div class="caption" data-qa-text>界面示意图</div><span class="dot"></span>
    <svg class="corner" viewBox="0 0 214 291" aria-hidden="true"><path d="M1 25V1h25M188 1h25v24M213 266v24h-25M26 290H1v-24"/></svg>
    <div class="document"><div class="doc-head"><svg width="25" height="31" viewBox="0 0 25 31" aria-hidden="true"><path d="M5 2h10l6 6v20H5Z" fill="none" stroke="#2866b8" stroke-width="2" stroke-linejoin="round"/><path d="M14 2v7h7M9 15h8M9 20h6" fill="none" stroke="#2866b8" stroke-width="2" stroke-linecap="round"/></svg></div><div class="doc-title" data-qa-text>选定文件</div><i class="doc-line l1"></i><i class="doc-line l2"></i><i class="doc-line l3"></i><div class="doc-footer" data-qa-text>SELECTED FILES</div></div>
    <div class="handoff"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 22h27m-10-10 10 10-10 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="phone"><div class="notch"></div><div class="phone-inner"><div class="phone-heading" data-qa-text>文件接收</div><div class="phone-sub" data-qa-text>在浏览器中下载本次选定的文件</div><div class="rule"></div><div class="files-label" data-qa-text>本次分享 · 2 个文件</div><div class="phone-file"><span class="tiny-doc"></span><div><div class="file-name" data-qa-text>项目资料.pdf</div><div class="file-meta" data-qa-text>PDF DOCUMENT</div></div></div><div class="phone-file"><span class="tiny-doc"></span><div><div class="file-name" data-qa-text>图文说明.zip</div><div class="file-meta" data-qa-text>ZIP ARCHIVE</div></div></div><div class="download" data-qa-text>选择文件下载</div><div class="expiry" data-qa-text>到期后停止分享</div></div></div>
    <div class="scene-tag" data-qa-text>选定 · 交付 · 结束</div>
  </section>
</main>
</body>
</html>
