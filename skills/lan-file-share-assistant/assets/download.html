<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>限时文件分享</title>
<style>
:root{color-scheme:light;--ink:#162945;--muted:#64748b;--blue:#2463eb;--line:#dfe8f3}*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}main{max-width:820px;margin:54px auto;padding:0 24px 40px}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;color:#45617d;margin-bottom:30px}.brand svg{width:34px;height:34px;background:var(--blue);border-radius:10px;padding:7px;color:white}.hero{background:linear-gradient(125deg,#fff 40%,#edf4ff);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 12px 35px #1e4b8a08}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.12em}.hero h1{font-size:30px;line-height:1.3;margin:12px 0 16px;overflow-wrap:anywhere}.summary{color:var(--muted);font-size:14px;margin:0}.expiry{margin-top:26px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.timer{font-size:14px;font-weight:650;color:#1952bb;background:#e6efff;padding:7px 13px;border-radius:9px;font-variant-numeric:tabular-nums}.end{font-size:12px;color:var(--muted)}section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}.section-head h2{font-size:16px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.file{display:flex;gap:14px;align-items:center;padding:20px;background:#fff;border:1px solid var(--line);border-radius:16px;margin:10px 0}.file-icon{width:42px;height:48px;flex:none;background:#eef4ff;color:var(--blue);border-radius:10px;padding:10px}.details{min-width:0;flex:1}.name{font-size:15px;font-weight:600;overflow-wrap:anywhere}.size{font-size:12px;color:var(--muted);margin-top:3px}.download{display:inline-flex;align-items:center;justify-content:center;color:white;background:var(--blue);text-decoration:none;border-radius:10px;font-size:13px;font-weight:650;padding:9px 16px;flex:none}.download:focus-visible{outline:3px solid #9ec5ff;outline-offset:3px}.download[aria-disabled=true]{background:#c7d1df;cursor:default}.notice{margin-top:26px;border-left:3px solid #c3d6f7;padding:0 0 0 14px;font-size:12px;color:var(--muted)}footer{margin-top:32px;font-size:11px;color:#8492a6;text-align:center}#state{font-size:13px;color:#a64e12;margin-top:12px} @media(max-width:520px){main{margin:26px auto;padding:0 16px 28px}.brand{margin-bottom:22px}.hero{padding:24px;border-radius:20px}.hero h1{font-size:25px}.file{gap:11px;padding:16px;flex-wrap:wrap}.details{flex-basis:calc(100% - 60px)}.download{width:100%;margin-top:3px}.expiry{gap:8px}footer{margin-top:24px}}
</style></head><body data-mode="@@MODE@@"><main><div class="brand"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3h9l5 5v13H5zM14 3v6h5M8 15h8m-4-3v6"/></svg>局域网文件分享助手</div><header class="hero"><div class="eyebrow">限时共享 · LOCAL FILE SHARE</div><h1>@@TITLE@@</h1><p class="summary">@@COUNT@@ 个文件 · 共 @@TOTAL@@ · 选择文件，即可下载到当前设备</p><div class="expiry"><span class="timer" id="timer" role="status">有效期内可下载</span><span class="end">截止：<time id="end" datetime="@@ISO@@">@@ISO@@</time></span></div><div id="state" role="status"></div></header><section aria-label="可下载文件"><div class="section-head"><h2>分享文件</h2><span>仅供下载</span></div>@@FILES@@</section><aside class="notice">仅在可互通的局域网内使用，HTTP 传输未加密，请在可信网络下载。<br>到期或分享者停止后，未完成的下载会被中断；已经保存的文件不受影响。</aside><footer>临时分享，按时关闭。文件直接从分享者的设备传送。</footer></main><script>
const end=Date.parse(document.getElementById('end').dateTime);document.getElementById('end').textContent=new Date(end).toLocaleString();function tick(){const remaining=Math.max(0,Math.ceil((end-Date.now())/1000));document.getElementById('timer').textContent=remaining?'剩余 '+Math.floor(remaining/60)+' 分 '+String(remaining%60).padStart(2,'0')+' 秒':'分享已到期';if(!remaining){document.getElementById('state').textContent='本次分享已失效。如需下载，请联系分享者重新创建。';document.querySelectorAll('.download').forEach(a=>{a.removeAttribute('href');a.setAttribute('aria-disabled','true');});}}tick();setInterval(tick,1000);
if (document.body.dataset.mode === 'folder') {
  async function refreshFiles() {
    if (Date.now() >= end) return;
    try {
      const response = await fetch(location.href, {cache: 'no-store'});
      if (response.ok) {
        const updated = new DOMParser().parseFromString(await response.text(), 'text/html');
        if (Date.now() >= end) return;
        const current = document.querySelector('section');
        const incoming = updated.querySelector('section');
        if (incoming && !current.isEqualNode(incoming)) current.replaceWith(incoming);
        const summary = updated.querySelector('.hero .summary');
        if (summary) document.querySelector('.hero .summary').textContent = summary.textContent;
      }
    } catch (_) {
      // The existing countdown remains authoritative until the next refresh.
    }
    setTimeout(refreshFiles, 2500);
  }
  setTimeout(refreshFiles, 2500);
}
</script></body></html>
